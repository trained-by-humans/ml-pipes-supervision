site_name: ml-pipes-supervision
site_description: Roboflow Supervision capabilities as composable ml-pipes operators.
site_url: https://supervision.ml-pipes.com/
repo_name: ml-pipes-supervision

theme:
  name: pixel-lab
  favicon: assets/favicon.svg
  footer_text: Build explicit ML pipelines
  header_background: "#8315F9"
  accent_color: "#8315F9"
  accent_dark_color: "#5E0AAE"
  accent_foreground_color: "#FFFFFF"

extra:
  analytics:
    provider: google
    measurement_id: G-CE2N1XKFVT
    consent_domain: ml-pipes.com
    privacy_policy: https://ml-pipes.com/privacy/
  site_navigation:
    footer_label: Packages
    header_size: 4
    footer_size: 7
    items:
      - title: Core
        url: https://ml-pipes.com/
      - title: Supervision
        url: https://supervision.ml-pipes.com/
        active: true
      - title: Vision
        url: https://github.com/trained-by-humans/ml-pipes/tree/main/packages/vision
      - title: Tensor
        url: https://github.com/trained-by-humans/ml-pipes/tree/main/packages/tensor
      - title: ONNX
        url: https://github.com/trained-by-humans/ml-pipes/tree/main/packages/onnx
      - title: Torch
        url: https://github.com/trained-by-humans/ml-pipes/tree/main/packages/torch
    catalog:
      title: All Packages →
      url: https://ml-pipes.com/PACKAGES/

nav:
  - Home: index.md
  - Learn:
      - Detect and Annotate: tutorials/detect_and_annotate.md
      - Save Detections: tutorials/save_detections.md
      - Filter Detections: tutorials/filter_detections.md
      - Detect Small Objects: tutorials/detect_small_objects.md
      - Track Objects on Video: tutorials/track_objects.md
      - Detection Heatmaps: tutorials/heatmaps.md
      - Count in Zone: tutorials/count_in_zone.md
      - Time in Zone: tutorials/time_in_zone.md
      - Track Zone Visits: tutorials/track_zone_visits.md
  - Pipeline Recipes:
      - Overview: recipes/gallery.md
      - Blurring Faces: recipes/blurring_faces.md
      - Count Objects Crossing a Line: recipes/count_objects_crossing_line.md
      - Zero-Shot Object Detection with YOLO-World: recipes/zero_shot_object_detection_with_yolo_world.md
      - Oriented Bounding Boxes: recipes/oriented_bounding_boxes.md
      - Reference: recipes/index.md
  - Reference: reference.md
  - Coverage: coverage.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - mkdocs_pixel_lab.github_alerts
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
