[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-supervision"
version = "0.1.2rc1"
description = "Roboflow Supervision and Inference compatibility wrappers for ml-pipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "annotation",
    "computer-vision",
    "pipelines",
    "supervision",
    "tracking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "ml-pipes-core==0.1.2rc1",
    "ml-pipes-vision==0.1.2rc1",
    "supervision>=0.29,<0.31",
    "trackers",
]

[project.urls]
Homepage = "https://trained-by-humans.github.io/ml-pipes-supervision/"
Documentation = "https://trained-by-humans.github.io/ml-pipes-supervision/"
Repository = "https://github.com/trained-by-humans/ml-pipes-supervision"
Issues = "https://github.com/trained-by-humans/ml-pipes-supervision/issues"
Changelog = "https://github.com/trained-by-humans/ml-pipes-supervision/releases"

[project.optional-dependencies]
inference = [
    # Inference 1.3.8 is the last Python <3.13 release that supports
    # Supervision 0.30; Python 3.13 requires Inference 1.7.
    "inference==1.3.8; python_version < '3.13'",
    "inference==1.7.1; python_version >= '3.13'",
]
test = [
    "pytest>=8",
    "inference==1.3.8; python_version < '3.13'",
    "inference==1.7.1; python_version >= '3.13'",
]
docs = [
    "mike>=2.1",
    "mkdocs-material>=9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "docs",
    "examples",
    "pyproject.toml",
    "src/ml_pipes",
]
