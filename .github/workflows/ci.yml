name: CI

run-name: "CI: ${{ github.event.pull_request.title || github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-matrix:
    name: Resolve Supervision compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matrix tooling
        run: python -m pip install packaging pytest

      - name: Test matrix and optional dependency selection
        run: python -m pytest -q .github/tests

      - name: Resolve lowest and highest permitted releases
        id: matrix
        run: |
          matrix="$(python .github/scripts/supervision_matrix.py --python-versions 3.10 3.11 3.12 3.13)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.supervision-profile }} Supervision ${{ matrix.supervision-version }}
    needs: dependency-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependency-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' 'supervision==${{ matrix.supervision-version }}'

      # Python 3.13 Inference requires Supervision >=0.30.6, so keep the
      # lowest core release independent of this optional integration.
      - name: Install optional Inference integration on Python 3.13
        if: matrix.python-version == '3.13' && matrix.supervision-profile != 'lowest'
        run: python -m pip install -e '.[test,inference]' 'supervision==${{ matrix.supervision-version }}'

      - name: Verify resolved dependencies
        run: |
          python -m pip show supervision
          python -m pip check

      - name: Run tests
        run: python -m pytest -q -rs

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          artifact-venv/bin/python -m pip install "$wheel_path"
          artifact-venv/bin/python -m pip check
          artifact-venv/bin/python -c 'import ml_pipes.supervision'
