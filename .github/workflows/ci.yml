name: CI

run-name: "CI: ${{ github.event.pull_request.title || github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-matrix:
    name: Resolve Supervision compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matrix tooling
        run: python -m pip install packaging pytest

      - name: Test matrix and optional dependency selection
        run: python -m pytest -q .github/tests

      - name: Resolve lowest and highest permitted releases
        id: matrix
        run: |
          matrix="$(python .github/scripts/supervision_matrix.py --python-versions 3.10 3.11 3.12 3.13)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  supervision-compat:
    name: "Supervision compat: Python ${{ matrix.python-version }} | Supervision ${{ matrix.supervision-version }} (${{ matrix.supervision-profile == 'lowest' && 'min' || matrix.supervision-profile == 'highest' && 'latest' || 'min/latest' }})"
    needs: dependency-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependency-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' 'supervision==${{ matrix.supervision-version }}'

      - name: Verify resolved dependencies
        run: |
          python -m pip show supervision
          python -m pip check

      - name: Run Supervision suite
        run: python -m pytest -q -rs tests --ignore=tests/inference_compat

  inference-compat:
    name: "Inference compat: Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Resolve this optional dependency independently of the Supervision
      # bounds matrix. Inference may require an older supported Supervision.
      - name: Install optional Inference integration
        run: python -m pip install -e '.[test,inference]'

      - name: Verify resolved dependencies
        run: |
          python -m pip show supervision inference
          python -m pip check

      - name: Run optional Inference compatibility suite
        run: python -m pytest -q -rs tests/inference_compat

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          artifact-venv/bin/python -m pip install "$wheel_path"
          artifact-venv/bin/python -m pip check
          artifact-venv/bin/python -I -c 'from pathlib import Path; import sys; import ml_pipes.supervision as package; assert Path(package.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'

  compatibility-summary:
    # Keep this check name stable for GitHub's required status checks.
    name: "Compat: Gate"
    needs: [dependency-matrix, supervision-compat, inference-compat]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all compatibility jobs succeeded
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.dependency-matrix.result }}
          SUPERVISION_RESULT: ${{ needs.supervision-compat.result }}
          INFERENCE_RESULT: ${{ needs.inference-compat.result }}
        run: |
          printf 'Matrix resolution: %s\nSupervision compatibility: %s\n' \
            "$MATRIX_RESULT" "$SUPERVISION_RESULT"
          printf 'Inference compatibility: %s\n' "$INFERENCE_RESULT"
          for result in "$MATRIX_RESULT" "$SUPERVISION_RESULT" "$INFERENCE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::All compatibility jobs must succeed; failed, cancelled, or skipped jobs are not accepted."
              exit 1
            fi
          done
